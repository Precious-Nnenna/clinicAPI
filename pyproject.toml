[project]
name = "clinicapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Osita Precious", email = "foroseetarh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
clinicapi = "clinicapi:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
